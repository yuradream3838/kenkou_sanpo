<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>発見ノート</title>
  <meta name="description" content="散策中に偶然見つけたものを、調べて記録する。いつもの街を探索する発見ノート。">
  <meta name="theme-color" content="#2f6f4f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="発見ノート">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a href="#/list" class="brand">🔍 発見ノート</a>
    <div id="header-stats" class="header-stats"></div>
  </header>

  <div id="update-banner" class="update-banner" role="status" hidden></div>
  <main id="main" class="main"></main>

  <a href="#/new" class="fab" aria-label="新しい発見を記録">＋</a>

  <nav class="nav" aria-label="メインメニュー">
    <a href="#/list" data-route="list"><span>📒</span>ノート</a>
    <a href="#/map" data-route="map"><span>🗺</span>地図</a>
    <a href="#/go" data-route="go"><span>🎲</span>おでかけ</a>
    <a href="#/zukan" data-route="zukan"><span>📖</span>図鑑</a>
    <a href="#/settings" data-route="settings"><span>⚙</span>設定</a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p class="card">このアプリを使うには JavaScript を有効にしてください。</p></noscript>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
